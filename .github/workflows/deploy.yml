name: Deploy Resume to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Assets are content-stable: cache them hard at the browser.
      # --delete runs on this pass only. The filters apply to the
      # destination listing too, so excluded HTML is not deleted here.
      - name: Sync assets to S3 (long cache)
        run: |
          aws s3 sync ./website s3://nicholasmadson.dev \
            --delete \
            --exclude "*.html" \
            --exclude "thumbnail*.png" \
            --cache-control "public,max-age=31536000,immutable"

      # The OG image is never fetched by a page visitor - only by link
      # scrapers (iMessage, LinkedIn, WhatsApp). A long cache buys real
      # users nothing and just makes the preview image impossible to
      # update without renaming it, so keep this one short.
      - name: Sync OG image to S3 (short cache)
        run: |
          aws s3 sync ./website s3://nicholasmadson.dev \
            --exclude "*" \
            --include "thumbnail*.png" \
            --cache-control "public,max-age=3600"

      # HTML must revalidate every request, otherwise a returning
      # visitor keeps a stale index.html in their own browser cache
      # for as long as the max-age says - CloudFront invalidation
      # only clears the edge, not the browser.
      - name: Sync HTML to S3 (always revalidate)
        run: |
          aws s3 sync ./website s3://nicholasmadson.dev \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"